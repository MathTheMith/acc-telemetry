services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY:-}
    volumes:
      - telemetry-data:/data
    ports:
      - "127.0.0.1:5001:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  telemetry-data:
