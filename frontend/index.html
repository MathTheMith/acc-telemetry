<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Trace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%2312161D'/%3E%3Cpath d='M-4 30 L18 -4 L26 -4 L4 30 Z' fill='%23E8A33D'/%3E%3Cpath d='M4 30 L26 -4 L30 -4 L8 30 Z' fill='%23ffffff'/%3E%3Cpath d='M8 30 L30 -4 L38 -4 L16 30 Z' fill='%23D7263D'/%3E%3C/svg%3E">
<!-- Self-hosted: no external font CDN to depend on (some networks/browsers
     block fonts.googleapis.com, which silently drops the whole type system
     to system fallbacks -- this removes that failure mode entirely). -->
<link rel="stylesheet" href="fonts/fonts.css">

<style>
  :root{
    --bg:#0A0D12;
    --panel:#12161D;
    --panel-2:#171C24;
    --panel-3:#1D2530;
    --border:#242B35;
    --border-soft:#1A2028;
    --text:#EDF0F4;
    --text-muted:#8B94A3;
    --text-faint:#586170;
    --accent:#E8A33D;
    --accent-soft:rgba(232,163,61,0.14);
    --green:#3ECF6B;
    --green-soft:rgba(62,207,107,0.16);
    --red:#FF5468;
    --red-soft:rgba(255,84,104,0.16);
    --purple:#A855F7;
    --purple-soft:rgba(168,85,247,0.16);
    --steer:#5EC8F2;
    --stripe-red:#D7263D; /* livery stripe + hero glow only -- never a data channel */

    --font-display:'Titillium Web', 'Arial Narrow', sans-serif;
    --font-body:'IBM Plex Sans', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    /* Faint carbon-fibre crosshatch -- a real material reference from the
       subject's own world, not a decorative pattern bolted on. */
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 7px),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--text); }
  button, select{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }


</style>
</head>
<body>
</body>
</html>
