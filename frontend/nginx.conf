server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Also used by the Windows desktop app (LapUploader) to push finished laps --
    # not just the browser dashboard -- so this proxy is the one public entry
    # point for both.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Self-hosted font files never change under the same name -- cache hard.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single unhashed HTML file -- never let the browser cache a stale copy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
